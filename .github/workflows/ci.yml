# Checks every push to main and every pull request the way a developer does before a commit (AGENTS.md, «Проверка»).
# Suites that need a database, Redis or a paid provider are skipped here: they are gated by their own variables.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit: a tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: pnpm of the version named in package.json
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The applications read the shared packages from their build output.
      - run: pnpm --filter @an30/contracts --filter @an30/messaging --filter @an30/database build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @an30/web build
