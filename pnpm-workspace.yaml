packages:
  - apps/*
  - packages/*
autoInstallPeers: false
injectWorkspacePackages: true
overrides:
  # GHSA-7p8r-x3mc-p8w7, host confusion via backslash. Fastify pulls in
  # both major lines transitively, so each needs its own patched floor.
  fast-uri@^4.0.0: '>=4.1.2'
  fast-uri@^3.0.0: '3.1.5'
  find-my-way: 9.7.0
  js-yaml: 5.2.2
  # GHSA-2v37-7h3g-55p8, zero-length custom generator loop.
  # Next/PostCSS currently resolve nanoid 3.x transitively.
  nanoid@^3.0.0: 3.3.18
  postcss: 8.5.25
  sharp: 0.35.3
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false
  sharp: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.62.1'
  - playwright-core@1.62.1
  - playwright@1.62.1
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'
  - bullmq@6.0.2
  - ioredis@6.0.0
