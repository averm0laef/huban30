packages:
  - apps/*
  - packages/*
autoInstallPeers: false
injectWorkspacePackages: true
overrides:
  # Multipart 10 still pins busboy 3.2.0; retain its patched compatible major.
  '@fastify/busboy': 3.2.5
  # Keep both Fastify URI dependency branches above their security fixes.
  fast-uri@^4.0.0: 4.2.3
  fast-uri@^3.0.0: 3.1.9
  # Nest 11 pins an older Fastify version; use its patched compatible major.
  fastify: 5.12.8
  find-my-way: 9.7.0
  js-yaml: 5.5.0
  nanoid@^3.0.0: 3.3.18
  postcss: 8.5.25
  sharp: 0.35.5
  source-map-js: 1.2.2
  # ESLint 10 still requests the affected minimatch 10 branch.
  minimatch@^10.2.6: 11.0.5
  # React Hooks supports either Zod major; resolve the patched v4 branch.
  zod: 4.6.7
  eslint-plugin-react-hooks>zod-validation-error: ^4.0.0
  # Vitest 4 supports Vite 7; stay on its patched stable branch.
  vite: 7.3.7
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false
  sharp: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.62.1'
  - playwright-core@1.62.1
  - playwright@1.62.1
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'
  - bullmq@6.0.2
  - ioredis@6.0.0
