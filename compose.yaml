name: an30

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: an30
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: an30
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U an30 -d an30"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2G
        reservations:
          memory: 512M
    networks: [backend]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          memory: 128M
    networks: [backend]

  clamav:
    image: clamav/clamav:1.5.3
    restart: unless-stopped
    environment:
      CLAMAV_NO_CLAMD: "false"
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMAV_NO_MILTERD: "true"
      CLAMD_CONF_CommandReadTimeout: "5"
      CLAMD_CONF_MaxFileSize: 20M
      CLAMD_CONF_MaxFiles: "1000"
      CLAMD_CONF_MaxQueue: "20"
      CLAMD_CONF_MaxRecursion: "8"
      CLAMD_CONF_MaxScanSize: 32M
      CLAMD_CONF_MaxScanTime: "30000"
      CLAMD_CONF_MaxThreads: "4"
      CLAMD_CONF_ReadTimeout: "65"
      CLAMD_CONF_StreamMaxLength: 20M
    expose:
      - "3310"
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      # The official entrypoint applies CLAMD_CONF_* with sed -i. A named
      # volume is populated from the image on first use and keeps /etc writable
      # without making the container root filesystem writable.
      - clamav_config:/etc/clamav
      - clamav_signatures:/var/lib/clamav
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=16m,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/log/clamav:rw,noexec,nosuid,nodev,size=32m,mode=1777
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 6m
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 3G
        reservations:
          memory: 2G
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: packages/database/Dockerfile
    image: an30-database:local
    restart: "no"
    environment:
      APP_DB_USER: an30_app
      APP_POSTGRES_PASSWORD_FILE: /run/secrets/app_database_password
      DB_HOST: postgres
      DB_NAME: an30
      DB_PORT: 5432
      DB_USER: an30
      DATABASE_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      NODE_ENV: production
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PROVISION_APP_ROLE: "true"
    secrets:
      - postgres_password
      - app_database_password
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 64M
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: an30-api:local
    restart: unless-stopped
    environment:
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      API_BIND_HOST: 0.0.0.0
      APP_ORIGIN: ${APP_BASE_URL:-http://localhost}
      AUTH_DEBUG_TOKENS: "false"
      CLAMAV_CONNECT_TIMEOUT_MS: "2000"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_SCAN_TIMEOUT_MS: "60000"
      # false only for a closed stand reached by bare IP over plain HTTP (no certificate yet).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      DB_HOST: postgres
      DB_NAME: an30
      DB_PORT: 5432
      DB_USER: an30_app
      NODE_ENV: production
      ENABLE_PUBLIC_CHECKOUT: ${ENABLE_PUBLIC_CHECKOUT:-false}
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      LEGAL_DOCUMENTS_APPROVED: ${LEGAL_DOCUMENTS_APPROVED:-false}
      YANDEX_ID_CLIENT_ID: ${YANDEX_ID_CLIENT_ID:-}
      VK_ID_CLIENT_ID: ${VK_ID_CLIENT_ID:-}
      MEDIA_PROBE_TIMEOUT_MS: "10000"
      ONE_C_PRICE_TYPE: ${ONE_C_PRICE_TYPE:-}
      ONE_C_PRICE_TYPE_SECONDARY: ${ONE_C_PRICE_TYPE_SECONDARY:-}
      PORT: 4000
      # «Подбор по автомобилю» (docs/PARTS_FINDER.md). Provider keys are optional
      # secret files: empty = that provider is off, the rest keeps working.
      PARTS_FINDER_ENABLED: ${PARTS_FINDER_ENABLED:-true}
      FAPI_KEY_FILE: /run/secrets/fapi_key
      FAPI_FITMENT_ENABLED: ${FAPI_FITMENT_ENABLED:-false}
      FAPI_DAILY_CREDIT_LIMIT: ${FAPI_DAILY_CREDIT_LIMIT:-1000}
      API_NINJAS_KEY_FILE: /run/secrets/api_ninjas_key
      # TecDoc (tecdoc.site): the vehicle and applicability catalogue; see docs/TECDOC.md.
      TECDOC_API_KEY_FILE: /run/secrets/tecdoc_api_key
      TECDOC_ENABLED: ${TECDOC_ENABLED:-true}
      TECDOC_MONTHLY_LIMIT: ${TECDOC_MONTHLY_LIMIT:-150000}
      TECDOC_PERIOD_START: ${TECDOC_PERIOD_START:-}
      TECDOC_DAILY_LIMIT: ${TECDOC_DAILY_LIMIT:-0}
      TECDOC_HOURLY_LIMIT: ${TECDOC_HOURLY_LIMIT:-0}
      TECDOC_VISITOR_DAILY_LIMIT: ${TECDOC_VISITOR_DAILY_LIMIT:-150}
      TECDOC_CACHE_TTL_SECONDS: ${TECDOC_CACHE_TTL_SECONDS:-86400}
      TECDOC_CACHE_MAX_ENTRIES: ${TECDOC_CACHE_MAX_ENTRIES:-20000}
      API_NINJAS_MODE: ${API_NINJAS_MODE:-off}
      POSTGRES_PASSWORD_FILE: /run/secrets/app_database_password
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_PORT: 6379
      ROSSKO_ENABLED: ${ROSSKO_ENABLED:-false}
      ROSSKO_DELIVERY_ID: ${ROSSKO_DELIVERY_ID:-000000001}
      ROSSKO_KEY1_FILE: /run/secrets/rossko_key1
      ROSSKO_KEY2_FILE: /run/secrets/rossko_key2
      REEFAPI_ENABLED: ${REEFAPI_ENABLED:-false}
      REEFAPI_KEY_FILE: /run/secrets/reefapi_key
      REEFAPI_MARKET: ${REEFAPI_MARKET:-de}
      REEFAPI_DAILY_CREDITS: ${REEFAPI_DAILY_CREDITS:-30}
      SESSION_SECRET_FILE: /run/secrets/session_secret
      # Read only by the staff dashboard to show whether mail is configured;
      # the worker is the service that actually sends mail.
      SMTP_HOST: ${SMTP_HOST:-}
      STORAGE_ROOT: /data/uploads
      SUPPLIER_MARKUP_PERCENT: ${SUPPLIER_MARKUP_PERCENT:-30}
      TRUST_PROXY_CIDRS: "${AN30_CADDY_PROXY_IP:-172.30.30.10}/32,${AN30_WEB_PROXY_IP:-172.30.30.11}/32"
    secrets:
      - app_database_password
      - redis_password
      - session_secret
      - data_encryption_key
      - rossko_key1
      - rossko_key2
      - reefapi_key
      - gemini_api_key
      - fapi_key
      - api_ninjas_key
      - tecdoc_api_key
    depends_on:
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          memory: 256M
    networks: [backend]

  storage-init:
    image: an30-api:local
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["install -d -o 10001 -g 10001 -m 0700 /data/uploads && chown -R 10001:10001 /data/uploads"]
    volumes:
      - uploads_data:/data/uploads
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      DB_HOST: postgres
      DB_NAME: an30
      DB_PORT: 5432
      DB_USER: an30_app
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      NODE_ENV: production
      POSTGRES_PASSWORD_FILE: /run/secrets/app_database_password
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_PORT: 6379
      PUBLIC_BASE_URL: ${APP_BASE_URL:-http://localhost}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-АН-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      VK_ENABLED: ${VK_ENABLED:-false}
      VK_ACCESS_TOKEN_FILE: /run/secrets/vk_access_token
      VK_PEER_ID: ${VK_PEER_ID:-}
      WORKER_HEALTH_PORT: 4001
    secrets:
      - app_database_password
      - redis_password
      - data_encryption_key
      - smtp_password
      - telegram_bot_token
      - vk_access_token
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 128M
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
        DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      ENABLE_PUBLIC_CHECKOUT: ${ENABLE_PUBLIC_CHECKOUT:-false}
      INTERNAL_API_URL: http://api:4000
      LEGAL_DOCUMENTS_APPROVED: ${LEGAL_DOCUMENTS_APPROVED:-false}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 128M
    networks:
      backend:
        ipv4_address: ${AN30_WEB_PROXY_IP:-172.30.30.11}

  caddy:
    build:
      context: ./infra/caddy
      dockerfile: Dockerfile
    image: an30-caddy:local
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@an30.ru}
      CANONICAL_ORIGIN: ${APP_BASE_URL:-https://an30.ru}
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      # Closed stand: one login and password for the whole site (infra/caddy/Caddyfile).
      SITE_PASSWORD_ENABLED: ${SITE_PASSWORD_ENABLED:-false}
      SITE_PASSWORD_HASH: ${SITE_PASSWORD_HASH:-$$2y$$10$$SGlRcgXW1uKEMxTMijjME.11M52ibS5DFfgsEMXJy3ne4bNxcYMPi}
      SITE_PASSWORD_USER: ${SITE_PASSWORD_USER:-an30}
      WWW_SITE_ADDRESS: ${WWW_SITE_ADDRESS:-http://www.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/proxy-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      backend:
        ipv4_address: ${AN30_CADDY_PROXY_IP:-172.30.30.10}

secrets:
  postgres_password:
    file: ${AN30_SECRETS_DIR:-./secrets}/postgres_password.txt
  app_database_password:
    file: ${AN30_SECRETS_DIR:-./secrets}/app_database_password.txt
  redis_password:
    file: ${AN30_SECRETS_DIR:-./secrets}/redis_password.txt
  session_secret:
    file: ${AN30_SECRETS_DIR:-./secrets}/session_secret.txt
  data_encryption_key:
    file: ${AN30_SECRETS_DIR:-./secrets}/data_encryption_key.txt
  smtp_password:
    file: ${AN30_SECRETS_DIR:-./secrets}/smtp_password.txt
  telegram_bot_token:
    file: ${AN30_SECRETS_DIR:-./secrets}/telegram_bot_token.txt
  vk_access_token:
    file: ${AN30_SECRETS_DIR:-./secrets}/vk_access_token.txt
  rossko_key1:
    file: ${AN30_SECRETS_DIR:-./secrets}/rossko_key1.txt
  rossko_key2:
    file: ${AN30_SECRETS_DIR:-./secrets}/rossko_key2.txt
  reefapi_key:
    file: ${AN30_SECRETS_DIR:-./secrets}/reefapi_key.txt
  gemini_api_key:
    file: ${AN30_SECRETS_DIR:-./secrets}/gemini_api_key.txt
  fapi_key:
    file: ${AN30_SECRETS_DIR:-./secrets}/fapi_key.txt
  api_ninjas_key:
    file: ${AN30_SECRETS_DIR:-./secrets}/api_ninjas_key.txt
  tecdoc_api_key:
    file: ${AN30_SECRETS_DIR:-./secrets}/tecdoc_api_key.txt

volumes:
  caddy_config:
  caddy_data:
  clamav_config:
  clamav_signatures:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: ${AN30_BACKEND_SUBNET:-172.30.30.0/24}
