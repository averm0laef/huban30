name: an30

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: an30
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: an30
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U an30 -d an30"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2G
        reservations:
          memory: 512M
    networks: [backend]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          memory: 128M
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: packages/database/Dockerfile
    image: an30-database:local
    restart: "no"
    environment:
      APP_DB_USER: an30_app
      APP_POSTGRES_PASSWORD_FILE: /run/secrets/app_database_password
      DB_HOST: postgres
      DB_NAME: an30
      DB_PORT: 5432
      DB_USER: an30
      DATABASE_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      NODE_ENV: production
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PROVISION_APP_ROLE: "true"
    secrets:
      - postgres_password
      - app_database_password
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 64M
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: an30-api:local
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_BASE_URL:-http://localhost}
      AUTH_DEBUG_TOKENS: "false"
      COOKIE_SECURE: "true"
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      DB_HOST: postgres
      DB_NAME: an30
      DB_PORT: 5432
      DB_USER: an30_app
      NODE_ENV: production
      ENABLE_PUBLIC_CHECKOUT: ${ENABLE_PUBLIC_CHECKOUT:-false}
      LEGAL_DOCUMENTS_APPROVED: ${LEGAL_DOCUMENTS_APPROVED:-false}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-disabled}
      PORT: 4000
      POSTGRES_PASSWORD_FILE: /run/secrets/app_database_password
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_PORT: 6379
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-20}
      SANDBOX_PAYMENT_WEBHOOK_SECRET_FILE: /run/secrets/sandbox_payment_webhook_secret
      SESSION_SECRET_FILE: /run/secrets/session_secret
      STORAGE_ROOT: /data/uploads
      TRUST_PROXY_HOPS: "1"
    secrets:
      - app_database_password
      - redis_password
      - session_secret
      - data_encryption_key
      - sandbox_payment_webhook_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          memory: 256M
    networks: [backend]

  storage-init:
    image: an30-api:local
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["install -d -o 10001 -g 10001 -m 0700 /data/uploads && chown -R 10001:10001 /data/uploads"]
    volumes:
      - uploads_data:/data/uploads
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: an30
      DB_PORT: 5432
      DB_USER: an30_app
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      NODE_ENV: production
      POSTGRES_PASSWORD_FILE: /run/secrets/app_database_password
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_PORT: 6379
      PUBLIC_BASE_URL: ${APP_BASE_URL:-http://localhost}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      VK_ENABLED: ${VK_ENABLED:-false}
      VK_ACCESS_TOKEN_FILE: /run/secrets/vk_access_token
      VK_PEER_ID: ${VK_PEER_ID:-}
      WORKER_HEALTH_PORT: 4001
    secrets:
      - app_database_password
      - redis_password
      - data_encryption_key
      - smtp_password
      - telegram_bot_token
      - vk_access_token
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 128M
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      ENABLE_PUBLIC_CHECKOUT: ${ENABLE_PUBLIC_CHECKOUT:-false}
      INTERNAL_API_URL: http://api:4000
      LEGAL_DOCUMENTS_APPROVED: ${LEGAL_DOCUMENTS_APPROVED:-false}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 128M
    networks: [backend]

  caddy:
    build:
      context: ./infra/caddy
      dockerfile: Dockerfile
    image: an30-caddy:local
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@an30.ru}
      CANONICAL_ORIGIN: ${APP_BASE_URL:-https://an30.ru}
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      WWW_SITE_ADDRESS: ${WWW_SITE_ADDRESS:-http://www.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/proxy-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    networks: [backend]

secrets:
  postgres_password:
    file: ${AN30_SECRETS_DIR:-./secrets}/postgres_password.txt
  app_database_password:
    file: ${AN30_SECRETS_DIR:-./secrets}/app_database_password.txt
  redis_password:
    file: ${AN30_SECRETS_DIR:-./secrets}/redis_password.txt
  session_secret:
    file: ${AN30_SECRETS_DIR:-./secrets}/session_secret.txt
  data_encryption_key:
    file: ${AN30_SECRETS_DIR:-./secrets}/data_encryption_key.txt
  sandbox_payment_webhook_secret:
    file: ${AN30_SECRETS_DIR:-./secrets}/sandbox_payment_webhook_secret.txt
  smtp_password:
    file: ${AN30_SECRETS_DIR:-./secrets}/smtp_password.txt
  telegram_bot_token:
    file: ${AN30_SECRETS_DIR:-./secrets}/telegram_bot_token.txt
  vk_access_token:
    file: ${AN30_SECRETS_DIR:-./secrets}/vk_access_token.txt

volumes:
  caddy_config:
  caddy_data:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  backend:
    driver: bridge
