# Local-only override. Values here are intentionally public and must never be
# used outside a developer workstation.
services:
  caddy:
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:443:443/udp"

  postgres:
    environment:
      POSTGRES_PASSWORD: an30-local-development-only
      POSTGRES_PASSWORD_FILE: !reset null
    secrets: !reset []

  redis:
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass an30-local-development-only
    secrets: !reset []
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a an30-local-development-only ping | grep -q PONG

  migrate:
    environment:
      APP_POSTGRES_PASSWORD: an30-app-local-development-only
      APP_POSTGRES_PASSWORD_FILE: !reset null
      DATABASE_ENVIRONMENT: development
      POSTGRES_PASSWORD: an30-local-development-only
      POSTGRES_PASSWORD_FILE: !reset null
    secrets: !reset []

  api:
    environment:
      AUTH_DEBUG_TOKENS: "true"
      COOKIE_SECURE: "false"
      DATA_ENCRYPTION_KEY: an30-local-data-encryption-key-public-only
      DEPLOYMENT_ENVIRONMENT: development
      ENABLE_PUBLIC_CHECKOUT: "true"
      GEMINI_API_KEY_FILE: !reset null
      LEGAL_DOCUMENTS_APPROVED: "true"
      POSTGRES_PASSWORD: an30-app-local-development-only
      REDIS_PASSWORD: an30-local-development-only
      # This override mounts no secrets, and config.ts resolves every *_FILE
      # path before it checks whether the integration is enabled. Left
      # inherited from compose.yaml these would make the API crash on ENOENT
      # at startup even though ROSSKO_ENABLED defaults to false.
      ROSSKO_KEY1_FILE: !reset null
      ROSSKO_KEY2_FILE: !reset null
      REEFAPI_KEY_FILE: !reset null
      SESSION_SECRET: an30-local-session-hmac-secret-public-only
    secrets: !reset []

  web:
    environment:
      DEPLOYMENT_ENVIRONMENT: development
      ENABLE_PUBLIC_CHECKOUT: "true"
      LEGAL_DOCUMENTS_APPROVED: "true"

  worker:
    environment:
      DEPLOYMENT_ENVIRONMENT: development
      DATA_ENCRYPTION_KEY: an30-local-data-encryption-key-public-only
      POSTGRES_PASSWORD: an30-app-local-development-only
      REDIS_PASSWORD: an30-local-development-only
      SMTP_PASSWORD_FILE: !reset null
      TELEGRAM_BOT_TOKEN_FILE: !reset null
      VK_ACCESS_TOKEN_FILE: !reset null
    secrets: !reset []

  seed:
    image: an30-database:local
    profiles: [dev-tools]
    restart: "no"
    command: ["node", "dist/seed.js"]
    environment:
      ALLOW_DEV_SEED: "true"
      DATABASE_ENVIRONMENT: development
      DB_HOST: postgres
      DB_NAME: an30
      DB_PORT: 5432
      DB_USER: an30
      NODE_ENV: development
      POSTGRES_PASSWORD: an30-local-development-only
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 64M
    networks: [backend]

  # Optional search engine for local trials only (docs/SEARCH_ENGINE.md).
  # Not started by default: `docker compose -f compose.yaml -f compose.dev.yaml
  # --profile search up -d opensearch`, then set SEARCH_ENGINE=opensearch and
  # OPENSEARCH_URL=http://opensearch:9200 for api/worker and run
  # `corepack pnpm --filter @an30/worker search:reindex`. Security plugin is
  # off because the port is bound to localhost and the data is a dev copy.
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    profiles: [search]
    restart: "no"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      bootstrap.memory_lock: "false"
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 2G
    networks: [backend]
